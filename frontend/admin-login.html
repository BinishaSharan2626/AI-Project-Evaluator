<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Project Evaluator</title>
    <link rel="stylesheet" href="/static/css/style.css?v=24">
</head>
<body style="overflow-x: hidden;">
    <nav class="navbar animate-fade-in">
        <div class="nav-logo">
            ✨ <span>AI Project Evaluator</span>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/signup.html">Sign Up</a>
            <a href="/admin-login.html" style="color: var(--text-main); font-weight: 600;">Admin</a>
        </div>
        <div class="nav-user">
            <button class="btn-outline" onclick="window.history.back()">← Back</button>
            <button class="btn-outline" onclick="window.location.href='/'">Home</button>
        </div>
    </nav>
    
    <div class="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="hero-form-wrapper animate-fade-in delay-100" style="width: 100%; max-width: 450px;">
            <div class="auth-container animate-float" style="margin: 0 auto; position: relative; z-index: 10; text-align: left; border: 1px solid var(--accent-purple);">
                
                <div style="margin-bottom: 14px;">
                    <button type="button" class="btn-outline" onclick="window.history.back()" style="font-size: 13px; padding: 5px 12px;">← Back</button>
                </div>

                <div style="text-align: center; margin-bottom: 24px;">
                    <div class="badge" style="display: inline-block; margin-bottom: 8px; background: rgba(139, 92, 246, 0.1); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 13px;">🛡️ Authorized Personnel Only</div>
                    <h2 style="margin-bottom: 0;">Admin Portal</h2>
                </div>

                <form id="adminLoginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="adminUsername">Admin Username</label>
                        <input type="text" id="adminUsername" required placeholder="Enter admin username" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Admin Password</label>
                        <input type="password" id="adminPassword" required placeholder="Enter admin password" autocomplete="new-password">
                    </div>
                    <div id="adminLoginError" class="error-msg"></div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;">Access Dashboard</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminLoginForm = document.getElementById('adminLoginForm');
            if (adminLoginForm) {
                adminLoginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const username = document.getElementById('adminUsername').value;
                    const password = document.getElementById('adminPassword').value;
                    const errorDiv = document.getElementById('adminLoginError');

                    // Administrator check with requested password Admin@123
                    if (username === 'admin' && password === 'Admin@123') {
                        localStorage.setItem('token', 'admin-auth-token');
                        localStorage.setItem('role', 'admin');
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        errorDiv.textContent = 'Invalid administrator credentials.';
                    }
                });
            }
        });

        // Always clear form fields on refresh or page show
        window.addEventListener('pageshow', () => {
            const form = document.getElementById('adminLoginForm');
            if (form) form.reset();
            const u = document.getElementById('adminUsername');
            const p = document.getElementById('adminPassword');
            if (u) u.value = '';
            if (p) p.value = '';
        });
    </script>
    <script src="/static/js/floating-background.js?v=7"></script>
</body>
</html>
