<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Evaluator - Forgot Password</title>
    <link rel="stylesheet" href="/static/css/style.css?v=15">
</head>
<body>
    <div class="auth-container">
        <div style="margin-bottom: 16px;">
            <button type="button" class="btn-outline" onclick="window.location.href='/'" style="font-size: 13px; padding: 5px 12px;">← Back to Login</button>
        </div>
        <h2>Reset Password</h2>
        <p>Enter your email to receive a password reset link.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" required placeholder="Enter your registered email">
            </div>
            <div id="resetMessage" class="success-msg"></div>
            <button type="submit" class="btn-primary" style="margin-top: 10px;">Send Reset Link</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <button type="button" class="btn-outline" style="width: 100%; justify-content: center;" onclick="window.location.href='/'">← Return to Login</button>
        </div>
    </div>
    <script src="/static/js/auth.js?v=4"></script>
</body>
</html>
